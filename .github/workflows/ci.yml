name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5
      - name: Run swift test
        run: swift test

  smoke:
    name: smoke
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Boot the signed app, open an external note, import it
        run: make smoke

  ui-test:
    name: ui-test (accessibility audit)
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: XCUITest accessibility audit at minimum/wide window sizes
        run: make ui-test
