# Optional XcodeGen spec. Primary build is Swift Package Manager (`swift test`).
# Ship a signed .app with `make app` (ad-hoc unless SIGN_IDENTITY is a Developer ID).
name: BANAL
options:
  bundleIdPrefix: dev.drawmeanelephant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
packages:
  BanalPackage:
    path: .
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: NO
targets:
  BANAL:
    type: application
    platform: macOS
    sources:
      - path: Sources/BANALApp
      - path: Resources/Assets.xcassets
    dependencies:
      - package: BanalPackage
        product: BANALCore
      - package: BanalPackage
        product: BANALPublisher
      - package: BanalPackage
        product: BANALAppModel
      - package: BanalPackage
        product: BANALScripting
    resources:
      - path: Resources/BANAL.help
      - path: Resources/BANAL.sdef
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.banal
        PRODUCT_NAME: BANAL
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BANAL
        INFOPLIST_KEY_CFAppleHelpAnchor: BANAL
        INFOPLIST_KEY_CFBundleHelpBookFolder: BANAL.help
        INFOPLIST_KEY_CFBundleHelpBookName: dev.drawmeanelephant.banal.help
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 draw me an elephant"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Supporting/BANAL.entitlements
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
      configs:
        Release:
          ENABLE_HARDENED_RUNTIME: YES
    postBuildScripts:
      - name: Build Apple Help Book index
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          help_book_locale="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/BANAL.help/Contents/Resources/en.lproj"
          if [ ! -d "${help_book_locale}" ]; then
            echo "warning: help book locale directory not found — Help Book index not built."
            exit 0
          fi
          if ! command -v hiutil >/dev/null 2>&1; then
            echo "warning: hiutil not found — Help Book index not built."
            exit 0
          fi
          hiutil -I corespotlight -Caf "${help_book_locale}/BANAL.cshelpindex" -g -s en -l en_US "${help_book_locale}"
      - name: Enable AppleScript dictionary
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          INFOPLIST_PATH_FULL="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
          /usr/libexec/PlistBuddy -c "Add :NSAppleScriptEnabled bool true" "$INFOPLIST_PATH_FULL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Add :OSAScriptingDefinition string BANAL.sdef" "$INFOPLIST_PATH_FULL" 2>/dev/null || true
          /usr/libexec/PlistBuddy -c "Print :OSAScriptingDefinition" "$INFOPLIST_PATH_FULL" >/dev/null
      - name: Build and embed helper engines (Boris & Oliver)
        basedOnDependencyAnalysis: false
        script: |
          set -euo pipefail
          HELPERS_DEST="${TARGET_BUILD_DIR}/${UNLOCALIZED_RESOURCES_FOLDER_PATH}/../Helpers"
          mkdir -p "${HELPERS_DEST}"
          "${SRCROOT}/Scripts/helpers.sh" "${SRCROOT}/dist"
          if [ -d "${SRCROOT}/dist/helpers" ]; then
            for helper in "${SRCROOT}/dist/helpers/"*; do
              if [ -f "$helper" ] && [ -x "$helper" ]; then
                target_file="${HELPERS_DEST}/$(basename "$helper")"
                cp "$helper" "$target_file"
                chmod +x "$target_file"
                if [ "${CODE_SIGNING_ALLOWED:-YES}" = "YES" ]; then
                  sign_id="${EXPANDED_CODE_SIGN_IDENTITY:--}"
                  [ -z "$sign_id" ] && sign_id="-"
                  codesign --force --sign "$sign_id" --timestamp=none "$target_file" || true
                fi
              fi
            done
          fi
  BANALCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BANALCoreTests
    dependencies:
      - package: BanalPackage
        product: BANALCore
  BANALPublisherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BANALPublisherTests
    dependencies:
      - package: BanalPackage
        product: BANALCore
      - package: BanalPackage
        product: BANALPublisher
  BANALUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - path: Tests/BANALUITests
    dependencies:
      - target: BANAL
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.banal.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: BANAL

schemes:
  BANAL:
    build:
      targets:
        BANAL: all
        BANALUITests: [test]
    test:
      gatherCoverageData: false
      targets:
        - BANALUITests
