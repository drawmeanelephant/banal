# Optional XcodeGen spec. Primary build is Swift Package Manager (`swift test`).
# Ship a signed .app with `make app` (ad-hoc unless SIGN_IDENTITY is a Developer ID).
name: BANAL
options:
  bundleIdPrefix: dev.drawmeanelephant
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "-"
    ENABLE_APP_SANDBOX: YES
    ENABLE_HARDENED_RUNTIME: NO
targets:
  BANAL:
    type: application
    platform: macOS
    sources:
      - path: Sources/BANALApp
      - path: Sources/BANALCore
      - path: Sources/BANALPublisher
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.drawmeanelephant.banal
        PRODUCT_NAME: BANAL
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: BANAL
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_NSHumanReadableCopyright: "© 2026 draw me an elephant"
        INFOPLIST_KEY_NSPrincipalClass: NSApplication
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: Supporting/BANAL.entitlements
        ENABLE_APP_SANDBOX: YES
        CODE_SIGN_STYLE: Manual
        CODE_SIGN_IDENTITY: "-"
    entitlements:
      path: Supporting/BANAL.entitlements
  BANALCoreTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BANALCoreTests
    dependencies:
      - target: BANAL
  BANALPublisherTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Tests/BANALPublisherTests
    dependencies:
      - target: BANAL
